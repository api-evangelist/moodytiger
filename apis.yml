aid: moodytiger
name: moodytiger
description: >-
  moodytiger is a technology-driven, design-led activewear brand for kids, offering
  leggings, shorts, tees, skirts and outerwear for boys and girls. Surfaced as a
  portfolio company of Qiming Venture Partners, its direct-to-consumer storefront runs
  on Shopify at moodytiger.com. The store has no bespoke first-party developer API, but
  it does expose a modern agent-native commerce surface: a published Universal Commerce
  Protocol (UCP, ucp.dev) MCP shopping endpoint, an /agents.md agent-instructions
  document mirrored at /llms.txt, and Shopify Customer Account OIDC discovery under
  /.well-known/. This profile captures those verifiable agent and well-known surfaces.
