source: https://moodytiger.com/agents.md
discovery: https://moodytiger.com/.well-known/ucp
notes: moodytiger's Shopify storefront exposes an agent-facing commerce MCP server via the Universal Commerce
  Protocol (UCP, https://ucp.dev). The MCP endpoint is documented in /agents.md and advertised in /.well-known/ucp.
  tools/list requires an agent profile URI (agent identity), so the tool schemas could not be enumerated
  anonymously; the tools and capabilities below are transcribed from the store's own /agents.md agent
  flow and the UCP merchant profile capability set. This is a platform (Shopify UCP) MCP surface, not
  a bespoke first-party API.
server:
  name: moodytiger UCP Shopping
  protocol: Universal Commerce Protocol (UCP)
  ucp_version: '2026-04-08'
  supported_versions:
  - '2026-04-08'
  - '2026-01-23'
  transport: http
  url: https://moodytiger.com/api/ucp/mcp
  canonical_url: https://moody-tiger-athletics.myshopify.com/api/ucp/mcp
  spec: https://ucp.dev/2026-04-08/specification/overview/
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
  auth: agent profile URI required for tools/list (buyer approval required at checkout)
capabilities:
- dev.ucp.shopping.catalog.search
- dev.ucp.shopping.catalog.lookup
- dev.ucp.shopping.cart
- dev.ucp.shopping.checkout
- dev.ucp.shopping.fulfillment
- dev.ucp.shopping.discount
- dev.ucp.shopping.order
- dev.shopify.catalog
tools:
- name: search_catalog
  description: Find products matching the buyer's intent (UCP catalog search).
  source: agents.md agent flow / dev.ucp.shopping.catalog.search
- name: create_cart
  description: Create a cart and add desired items.
  source: agents.md agent flow / dev.ucp.shopping.cart
- name: create_checkout
  description: Start the purchase flow from a cart.
  source: agents.md agent flow / dev.ucp.shopping.checkout
- name: update_checkout
  description: Set shipping address and method on an in-progress checkout.
  source: agents.md agent flow / dev.ucp.shopping.fulfillment
- name: complete_checkout
  description: Finalize the purchase; buyer must approve payment.
  source: agents.md agent flow / dev.ucp.shopping.checkout
deployment:
  mode: remote
